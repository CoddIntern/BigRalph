<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigRalph - My Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="style.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex-shrink-0 flex items-center">
                        <i data-feather="gift" class="h-8 w-8 text-blue-600"></i>
                        <span class="ml-2 text-xl font-bold text-gray-900">BigRalph</span>
                    </a>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="index.html"
                            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Home</a>
                    </div>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <div class="dropdown relative">
                        <button class="flex items-center space-x-2">
                            <span id="wallet-balance-nav"
                                class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded">Loading...</span>
                            <img class="h-8 w-8 rounded-full" src="http://static.photos/people/200x200/42"
                                alt="Profile">
                        </button>
                        <div class="dropdown-menu mt-2 py-2 bg-white rounded-md shadow-lg">
                            <a href="wallet.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i
                                    data-feather="credit-card" class="w-4 h-4 mr-2"></i> Wallet</a>
                            <div class="border-t border-gray-100"></div>
                            <a href="#" id="logout-btn"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i
                                    data-feather="log-out" class="w-4 h-4 mr-2"></i> Sign out</a>
                        </div>
                    </div>
                </div>
                <div class="-mr-2 flex items-center sm:hidden">
                    <button type="button"
                        class="mobile-menu-button inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500">
                        <i data-feather="menu"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div class="mobile-menu hidden sm:hidden">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="index.html"
                    class="text-gray-500 hover:text-gray-700 block px-3 py-2 rounded-md text-base font-medium">Home</a>
                <a href="wallet.html"
                    class="text-gray-500 hover:text-gray-700 block px-3 py-2 rounded-md text-base font-medium">Wallet</a>
                <a href="#" id="mobile-logout-btn"
                    class="text-gray-500 hover:text-gray-700 block px-3 py-2 rounded-md text-base font-medium">Sign
                    out</a>
            </div>
        </div>
    </nav>

    <!-- Wallet Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="bg-white rounded-lg shadow-md p-6 sm:p-8">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-900">My Wallet</h2>
                    <p class="mt-1 text-sm text-gray-500">Manage your raffle ticket funds</p>
                </div>

                <div class="bg-blue-50 rounded-lg p-6 mb-8">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <h3 class="text-lg font-medium text-gray-900">Current Balance</h3>
                            <p id="current-balance" class="text-3xl font-bold text-blue-600 mt-2">₦0.00</p>
                        </div>
                        <div class="mt-4 sm:mt-0">
                            <button id="show-fund-modal"
                                class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                <i data-feather="plus" class="mr-2"></i> Fund Wallet
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Recent Transactions</h3>
                    <div id="transactions" class="space-y-4">
                        <div class="animate-pulse flex flex-col space-y-4">
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="h-4 bg-gray-200 rounded"></div>
                            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fund Wallet Modal -->
        <div id="fund-modal" class="hidden fixed inset-0 overflow-y-auto z-50">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                    <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
                </div>
                <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                <div
                    class="inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full sm:p-6">
                    <div>
                        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100">
                            <i data-feather="credit-card" class="h-6 w-6 text-blue-600"></i>
                        </div>
                        <div class="mt-3 text-center sm:mt-5">
                            <h3 class="text-lg leading-6 font-medium text-gray-900">Fund Your Wallet</h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500">Enter the amount you want to add to your wallet.</p>
                                <div class="mt-4">
                                    <div class="relative rounded-md shadow-sm">
                                        <div
                                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span class="text-gray-500 sm:text-sm">₦</span>
                                        </div>
                                        <input type="number" id="fund-amount"
                                            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-8 pr-12 py-3 sm:text-sm border-gray-300 rounded-md"
                                            placeholder="0.00" aria-describedby="price-currency">
                                        <div
                                            class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                            <span class="text-gray-500 sm:text-sm" id="price-currency">NGN</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="fund-error" class="hidden mt-2 text-sm text-red-600 text-center"></div>
                    <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
                        <button id="confirm-fund" type="button"
                            class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:col-start-2 sm:text-sm">
                            Fund Wallet
                        </button>
                        <button id="cancel-fund" type="button"
                            class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:col-start-1 sm:text-sm">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-400 text-sm">
                © 2023 BigRalph. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Check authentication
        document.addEventListener('DOMContentLoaded', async function () {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // Mobile menu toggle
            document.querySelector('.mobile-menu-button').addEventListener('click', function () {
                document.querySelector('.mobile-menu').classList.toggle('hidden');
            });

            // Logout buttons
            document.getElementById('logout-btn').addEventListener('click', function () {
                localStorage.removeItem('access_token');
                window.location.href = 'index.html';
            });

            document.getElementById('mobile-logout-btn').addEventListener('click', function () {
                localStorage.removeItem('access_token');
                window.location.href = 'index.html';
            });

            // Fund modal controls
            document.getElementById('show-fund-modal').addEventListener('click', function () {
                document.getElementById('fund-modal').classList.remove('hidden');
            });

            document.getElementById('cancel-fund').addEventListener('click', function () {
                document.getElementById('fund-modal').classList.add('hidden');
                document.getElementById('fund-error').classList.add('hidden');
            });

            // Fund wallet form submission
            document.getElementById('confirm-fund').addEventListener('click', async function () {
                const amount = parseFloat(document.getElementById('fund-amount').value);
                const errorDiv = document.getElementById('fund-error');

                if (isNaN(amount) || amount <= 0) {
                    errorDiv.textContent = 'Please enter a valid amount greater than 0';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                try {
                    const response = await fetch('/api/v1/wallet/fund', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ amount })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Failed to fund wallet');
                    }

                    // Update balance and close modal
                    await loadWallet();
                    document.getElementById('fund-modal').classList.add('hidden');
                    document.getElementById('fund-amount').value = '';

                } catch (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.classList.remove('hidden');
                }
            });

            // Load wallet data
            await loadWallet();

            feather.replace();
        });

        // Format currency in Naira
        function formatCurrency(amount) {
            return '₦' + amount.toLocaleString();
        }

        // Load wallet data
        async function loadWallet() {
            const token = localStorage.getItem('access_token');
            if (!token) return;

            try {
                // Get wallet balance
                const walletResponse = await fetch('/api/v1/wallet', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!walletResponse.ok) {
                    throw new Error('Failed to load wallet');
                }

                const walletData = await walletResponse.json();

                // Update balance display
                document.getElementById('current-balance').textContent = formatCurrency(walletData.balance);
                document.getElementById('wallet-balance-nav').textContent = formatCurrency(walletData.balance);

                // Load transactions (mock for now)
                const transactionsDiv = document.getElementById('transactions');
                transactionsDiv.innerHTML = `
                    <div class="border-b border-gray-200 pb-4">
                        <div class="flex justify-between">
                            <p class="text-sm font-medium text-gray-900">Wallet Funding</p>
                            <p class="text-sm text-gray-500">Today</p>
                        </div>
                        <p class="text-sm text-gray-500 mt-1">Deposit via bank transfer</p>
                        <p class="text-sm font-medium text-green-600 mt-1">+₦10,000.00</p>
                    </div>
                    <div class="border-b border-gray-200 pb-4">
                        <div class="flex justify-between">
                            <p class="text-sm font-medium text-gray-900">Ticket Purchase</p>
                            <p class="text-sm text-gray-500">2 days ago</p>
                        </div>
                        <p class="text-sm text-gray-500 mt-1">iPhone 14 Pro raffle</p>
                        <p class="text-sm font-medium text-red-600 mt-1">-₦2,500.00</p>
                    </div>
                `;

            } catch (error) {
                console.error('Error loading wallet:', error);
                if (error.message === 'Unauthorized') {
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                }
            }
        }
    </script>
</body>

</html>
